<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 2 — One Browser, Every Apple Device</title>
<link rel="stylesheet" href="shared.css">
<style>
  .slide { padding: 64px 110px 80px; }
  .head-block { margin-top: 84px; }
  .headline .thin { color: var(--text); }

  .family { margin-top: 56px; display: flex; align-items: flex-end; justify-content: center; gap: 64px; }
  .device { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .device .label {
    font-family: var(--font-mono); font-size: 21px; font-weight: 500;
    letter-spacing: 0.2em; color: var(--muted);
    display: flex; align-items: center; gap: 12px;
  }
  .device .label b { color: var(--text); font-weight: 500; }

  /* Mac — real app screenshot, window treatment */
  .macshot {
    width: 1230px; border-radius: 20px; overflow: hidden; position: relative;
    box-shadow: 0 60px 140px -40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.10);
  }
  .macshot img { display: block; width: 1230px; }

  /* iPad — black bezel frame */
  .ipad {
    width: 500px; padding: 14px; border-radius: 42px; background: #05060a;
    box-shadow: 0 40px 100px -36px rgba(0,0,0,0.85), inset 0 0 0 1.5px rgba(255,255,255,0.14);
    position: relative;
  }
  .ipad img { display: block; width: 100%; border-radius: 30px; }
  .ipad .cam {
    position: absolute; top: 50%; left: 6px; transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.22);
  }

  /* iPhone — black bezel frame with dynamic island */
  .iphone {
    width: 356px; padding: 13px; border-radius: 60px; background: #05060a;
    box-shadow: 0 40px 100px -36px rgba(0,0,0,0.85), inset 0 0 0 1.5px rgba(255,255,255,0.14);
    position: relative;
  }
  .iphone img { display: block; width: 100%; border-radius: 47px; }
  .iphone .island {
    position: absolute; top: 29px; left: 50%; transform: translateX(-50%);
    width: 94px; height: 27px; border-radius: 999px; background: #05060a; z-index: 5;
  }
</style>
</head>
<body>
<div class="slide slide--dark">
  <div class="brand"><img src="../../assets/img/icon-192.png" alt="">Kenja<em>Browser</em></div>
  <div class="for-mac">FREE · FOR MAC</div>

  <div class="head-block">
    <h1 class="headline">One Browser. <span class="thin">Every Apple Device.</span></h1>
    <p class="sub-en">Live captions on your Mac — the same clean, private browser on iPhone and iPad</p>
    <p class="sub-jp">Macも、iPhoneも、iPadも。同じブラウザを。</p>
  </div>

  <div class="family">
    <div class="device">
      <div class="macshot"><img src="../../assets/img/shot-1.jpg" alt=""></div>
      <div class="label"><b>MACOS 26</b> · LIVE CAPTIONS</div>
    </div>

    <div class="device">
      <div class="ipad"><span class="cam"></span><img src="assets/ipad-search.png" alt=""></div>
      <div class="label"><b>IPADOS 26</b> · PRIVATE BROWSING</div>
    </div>

    <div class="device">
      <div class="iphone"><span class="island"></span><img src="assets/iphone-search.png" alt=""></div>
      <div class="label"><b>IOS 26</b> · FAST SEARCH</div>
    </div>
  </div>

  <script src="audit.js"></script>
</div>
</body>
</html>
